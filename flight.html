<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0818;font-family:'Orbitron',system-ui,sans-serif;color:#d8ecff;user-select:none;-webkit-user-select:none}
  body.playing{cursor:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  small{display:block;font-size:10px;letter-spacing:.35em;color:#8fb2c8;font-weight:500}
  #topL{position:absolute;top:20px;left:28px;font-size:30px;font-weight:900;color:#8defff}
  #topC{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;font-size:28px;font-weight:900;color:#fff}
  #topC div{font-size:11px;letter-spacing:.25em;color:#ffb3d9;font-weight:500;margin-top:2px}
  #topR{position:absolute;top:20px;right:28px;text-align:right;font-size:30px;font-weight:900;color:#ffa6d5}
  #bottom{position:absolute;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .lbl{font-size:10px;letter-spacing:.3em;color:#8fb2c8;margin-bottom:6px}
  .bar{position:relative;height:12px;background:rgba(10,20,40,.55);border:1px solid rgba(141,239,255,.4);border-radius:3px;overflow:hidden}
  .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4bd6ff,#8f7bff)}
  #hull{width:280px} #hull.low .bar>i{background:linear-gradient(90deg,#ff6b8a,#ff9c5c)}
  #bb{text-align:center;width:230px}
  #bb .bar>i{background:linear-gradient(90deg,#7affc9,#4bd6ff)}
  #boost{width:200px} #boost .bar>i{background:linear-gradient(90deg,#ffd36b,#ff9c5c)}
  #spd{font-size:20px;font-weight:700;color:#d8ecff;margin-top:6px;text-align:right}
  #prompt{position:absolute;left:50%;top:63%;transform:translateX(-50%);padding:12px 26px;border:2px solid #7affc9;border-radius:10px;background:rgba(8,30,30,.55);font-size:22px;font-weight:900;letter-spacing:.2em;color:#7affc9;opacity:0;transition:opacity .15s}
  #prompt.on{opacity:1;animation:pls .5s infinite alternate}
  @keyframes pls{to{transform:translateX(-50%) scale(1.06)}}
  #hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);max-width:760px;text-align:center;font-size:15px;letter-spacing:.08em;line-height:1.5;color:#e8f4ff;background:rgba(10,15,40,.55);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .4s}
  #feed{position:absolute;top:26%;left:50%;transform:translateX(-50%);text-align:center;width:80%}
  .pop{font-size:24px;font-weight:900;letter-spacing:.1em;animation:pop 1.3s ease-out forwards;margin-bottom:6px}
  .pop.big{font-size:46px;letter-spacing:.2em}
  @keyframes pop{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1.05)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  #markers .mk{position:fixed;left:0;top:0;pointer-events:none;text-align:center;font-weight:700;white-space:nowrap}
  .mk b{display:block;font-size:20px;line-height:1}
  .mk small{font-size:11px;letter-spacing:.1em;color:inherit;margin-top:2px}
  .mk.enemy{color:#ffa6d5} .mk.missile{color:#ff6b6b} .mk.gate{color:#ffd36b} .mk.lock b{animation:blink .35s infinite alternate}
  .mk.missile.danger b{font-size:30px}
  @keyframes blink{to{opacity:.3}}
  #aim{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(141,239,255,.85);border-radius:50%;pointer-events:none;display:none;z-index:3}
  #aim::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
  #cross{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:1px solid rgba(255,255,255,.45);border-radius:50%;pointer-events:none;display:none}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,6,34,.35),rgba(6,4,22,.82));text-align:center;z-index:5;backdrop-filter:blur(2px)}
  #overlay h1{font-size:clamp(32px,6.4vw,84px);font-weight:900;letter-spacing:.12em;line-height:1.05;color:#fff;text-shadow:0 0 14px rgba(75,214,255,.7),3px 2px 0 rgba(255,111,181,.8)}
  #overlay h2{margin-top:12px;font-size:13px;letter-spacing:.45em;color:#ffa6d5;font-weight:700}
  .keys{display:grid;grid-template-columns:auto auto;gap:10px 22px;margin:28px auto 0;width:max-content;font-size:13px;letter-spacing:.1em;text-align:left;align-items:center}
  kbd{display:inline-block;font-family:inherit;font-weight:700;padding:3px 9px;border:1px solid #8defff;border-radius:6px;color:#8defff;background:rgba(75,214,255,.08);font-size:12px}
  .diff{margin-top:26px;display:flex;gap:12px;justify-content:center}
  .btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:900;letter-spacing:.25em;border-radius:8px;padding:12px 26px;font-size:14px;color:#cfeaff;background:rgba(75,214,255,.08);border:2px solid rgba(141,239,255,.4)}
  .btn.sel{border-color:#7affc9;color:#7affc9;background:rgba(122,255,201,.12)}
  .btn.go{margin-top:26px;font-size:20px;padding:16px 42px;color:#0a0818;background:#7affc9;border-color:#7affc9}
  .btn:hover{filter:brightness(1.15)}
  .tip{margin:18px auto 0;font-size:12px;letter-spacing:.12em;color:#9bb3cc;max-width:620px;line-height:1.7}
  #err{position:fixed;left:0;right:0;top:40%;text-align:center;color:#ff8aa8;font-size:18px;display:none;z-index:9}
</style>

<body>
<div id="hud">
  <div id="topL"><small>SCORE</small><span id="scoreV">0000000</span></div>

    <div id="hull"><div class="lbl">HULL</div><div class="bar"><i id="hullBar"></i></div></div>

  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   NEON RICOCHET SKIES — 3D flight with a "Bounce Back" missile parry
   ===================================================================== */
const R_WORLD = 700, CEIL = 260, FLOOR_Y = 6;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rand=(a,b)=>a+Math.random()*(b-a);
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const hdr=(hex,k)=>new THREE.Color(hex).multiplyScalar(k);
const $=id=>document.getElementById(id);
const angDiff=(a,b)=>{ let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; };

const DIFF={
  easy:  { enemyMax:4, fireMin:6.0, fireMax:10, mSpeed:46, mTurn:0.75, dmg:10, hp:5, lockT:1.5, globalCD:3.2, parryCD:1.2 },
  normal:{ enemyMax:6, fireMin:3.8, fireMax:7,  mSpeed:56, mTurn:1.1,  dmg:18, hp:6, lockT:1.1, globalCD:2.0, parryCD:1.6 }
};
let diffKey='easy', D=DIFF.easy;

/* ---------- renderer / softer post stack ---------- */
const PR=Math.min(window.devicePixelRatio||1,1.5);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(PR); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.95;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0818);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.3,4000);
scene.add(camera);

const rt=new THREE.WebGLRenderTarget(innerWidth*PR,innerHeight*PR,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt); composer.setPixelRatio(PR); composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const GLOW=[0,0.22,0.42,0.75], GLOW_NAME=['OFF','LOW','MEDIUM','HIGH']; let glowIdx=2;
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),GLOW[glowIdx],0.6,1.0);
composer.addPass(bloom);
const fxPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uAb:{value:0.0007},uBlur:{value:0},uHurt:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uAb,uBlur,uHurt; varying vec2 vUv;
    vec3 samp(vec2 uv,vec2 off){ return vec3(texture2D(tDiffuse,uv+off).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-off).b); }
    void main(){
      vec2 c=vUv-0.5; vec2 off=c*(uAb+dot(c,c)*0.004); vec3 col;
      if(uBlur>0.003){ col=vec3(0.0); for(int i=0;i<6;i++){ float s=float(i)/6.0; col+=samp(vUv-c*uBlur*s,off); } col/=6.0; }
      else col=samp(vUv,off);
      col*=1.0-smoothstep(0.35,1.0,length(c)*1.3)*0.38;
      col+=vec3(0.55,0.05,0.1)*uHurt*smoothstep(0.25,0.9,length(c)*1.4);
      gl_FragColor=vec4(col,1.0);
    }`
});
composer.addPass(fxPass); composer.addPass(new OutputPass());

/* ---------- shared uniforms / world shaders ---------- */
const U={ uCam:{value:V3()}, uPlayer:{value:V3()} };
const GRID=`float gridLine(vec2 c,float size,float w){ vec2 u=c/size; vec2 g=abs(fract(u-0.5)-0.5)/fwidth(u); return 1.0-min(min(g.x,g.y)/w,1.0); }`;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.ShaderMaterial({
  uniforms:{uCam:U.uCam},
  vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`varying vec3 vW; uniform vec3 uCam; ${GRID}
    void main(){
      float l1=gridLine(vW.xz,20.0,1.0), l2=gridLine(vW.xz,100.0,1.4);
      float dist=length(vW.xz-uCam.xz); float fade=exp(-dist*0.0017);
      vec3 lc=mix(vec3(0.15,0.7,1.0),vec3(0.85,0.3,0.8),smoothstep(-600.0,600.0,vW.x));
      vec3 col=vec3(0.02,0.025,0.08)+lc*(l1*0.2+l2*0.5);
      col=mix(vec3(0.17,0.06,0.24),col,fade);
      gl_FragColor=vec4(col,1.0);
    }`
}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// Realistic Sky & Atmospheric Lighting
scene.background = new THREE.Color(0x6ba5e8);
scene.fog = new THREE.FogExp2(0x8ebcee, 0.0003);

const sunLight = new THREE.DirectionalLight(0xfffaec, 2.8);
sunLight.position.set(400, 600, 300);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0xd4e4ff, 1.4));

const gltfLoader = new GLTFLoader();

// Load City GLB
gltfLoader.load('procedural_city_7.glb', (gltf) => {
  const city = gltf.scene;
  city.scale.set(1.5, 1.5, 1.5);
  city.position.set(0, 0, 0);
  scene.add(city);
});

// Load Mountain GLB
gltfLoader.load('peak_mountain_hiking_trail.glb', (gltf) => {
  const mtn = gltf.scene;
  mtn.scale.set(6, 6, 6);
  mtn.position.set(-700, -10, -600);
  scene.add(mtn);
});

/* distant mountains (calm silhouettes) */
{
  const mm=new THREE.MeshBasicMaterial({color:0x140c2e}), mm2=new THREE.MeshBasicMaterial({color:0x1d1140});
  for(let i=0;i<56;i++){
    const a=(i/56)*Math.PI*2+rand(-.04,.04), far=i%2, r=far?1500:1150, h=rand(150,380)*(far?1.3:1);
    const m=new THREE.Mesh(new THREE.ConeGeometry(rand(160,320),h,5),far?mm2:mm);
    m.position.set(Math.cos(a)*r,h/2-6,Math.sin(a)*r); m.rotation.y=rand(0,6); scene.add(m);
  }
}

/* soft energy boundary wall — this is where you "bounce back" */
const boundary=new THREE.Mesh(new THREE.CylinderGeometry(R_WORLD,R_WORLD,CEIL+40,96,1,true),new THREE.ShaderMaterial({
  uniforms:{uPlayer:U.uPlayer}, side:THREE.DoubleSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`varying vec3 vW; uniform vec3 uPlayer; ${GRID}
    void main(){
      float l=gridLine(vec2(atan(vW.z,vW.x)*${R_WORLD}.0,vW.y),30.0,1.0);
      float near=smoothstep(260.0,0.0,distance(vW,uPlayer));
      vec3 col=vec3(0.2,0.55,1.0)*(l*(0.05+near*0.5)+near*0.03);
      gl_FragColor=vec4(col,1.0);
    }`
}));
boundary.position.y=(CEIL+40)/2-20; scene.add(boundary);

/* towers = bouncy obstacles + speed reference */
const towers=[];
{
  const bm=new THREE.MeshBasicMaterial({color:0x0b0f2c});
  const em1=new THREE.LineBasicMaterial({color:hdr(0x4bd6ff,0.9)}), em2=new THREE.LineBasicMaterial({color:hdr(0xff6fb5,0.9)});
  for(let i=0;i<90;i++){
    let x,z,tries=0; do{ const a=rand(0,Math.PI*2), r=rand(70,R_WORLD-60); x=Math.cos(a)*r; z=Math.sin(a)*r; tries++; }while(Math.hypot(x,z-350)<90&&tries<20);
    const hx=rand(6,13), hz=rand(6,13), h=rand(25,90), geo=new THREE.BoxGeometry(hx*2,h,hz*2);
    const m=new THREE.Mesh(geo,bm); m.position.set(x,h/2,z); scene.add(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),i%2?em1:em2); e.position.copy(m.position); scene.add(e);
    towers.push({x,z,hx,hz,h});
  }
}
function towerAt(p,pad){ for(const t of towers){ if(p.y<t.h+pad&&Math.abs(p.x-t.x)<t.hx+pad&&Math.abs(p.z-t.z)<t.hz+pad) return t; } return null; }

/* ---------- particles ---------- */
const MAXP=5000;
const P={pos:new Float32Array(MAXP*3),col:new Float32Array(MAXP*3),size:new Float32Array(MAXP),vel:new Float32Array(MAXP*3),life:new Float32Array(MAXP),max:new Float32Array(MAXP),bcol:new Float32Array(MAXP*3),bsize:new Float32Array(MAXP),grav:new Float32Array(MAXP),head:0};
for(let i=0;i<MAXP;i++) P.pos[i*3+1]=-9999;
const pgeo=new THREE.BufferGeometry();
const pPosA=new THREE.BufferAttribute(P.pos,3),pColA=new THREE.BufferAttribute(P.col,3),pSizeA=new THREE.BufferAttribute(P.size,1);
[pPosA,pColA,pSizeA].forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
pgeo.setAttribute('position',pPosA); pgeo.setAttribute('aColor',pColA); pgeo.setAttribute('aSize',pSizeA);
const pmat=new THREE.ShaderMaterial({uniforms:{uScale:{value:600}},
  vertexShader:`attribute float aSize; attribute vec3 aColor; uniform float uScale; varying vec3 vC;
    void main(){ vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=aSize*uScale/max(0.1,-mv.z); }`,
  fragmentShader:`varying vec3 vC; void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.0,d); gl_FragColor=vec4(vC*a*a,1.0); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const points=new THREE.Points(pgeo,pmat); points.frustumCulled=false; scene.add(points);
function emit(x,y,z,vx,vy,vz,c,size,life,grav=0){
  const i=P.head; P.head=(P.head+1)%MAXP;
  P.pos[i*3]=x;P.pos[i*3+1]=y;P.pos[i*3+2]=z; P.vel[i*3]=vx;P.vel[i*3+1]=vy;P.vel[i*3+2]=vz;
  P.bcol[i*3]=c.r;P.bcol[i*3+1]=c.g;P.bcol[i*3+2]=c.b; P.bsize[i]=size;P.life[i]=life;P.max[i]=life;P.grav[i]=grav;
}
function updateParticles(dt){
  const drag=Math.exp(-1.4*dt);
  for(let i=0;i<MAXP;i++){
    if(P.life[i]<=0) continue; P.life[i]-=dt;
    if(P.life[i]<=0){P.size[i]=0;P.col[i*3]=P.col[i*3+1]=P.col[i*3+2]=0;continue;}
    const k=P.life[i]/P.max[i],i3=i*3;
    P.vel[i3]*=drag;P.vel[i3+1]=P.vel[i3+1]*drag-P.grav[i]*dt;P.vel[i3+2]*=drag;
    P.pos[i3]+=P.vel[i3]*dt;P.pos[i3+1]+=P.vel[i3+1]*dt;P.pos[i3+2]+=P.vel[i3+2]*dt;
    P.col[i3]=P.bcol[i3]*k;P.col[i3+1]=P.bcol[i3+1]*k;P.col[i3+2]=P.bcol[i3+2]*k; P.size[i]=P.bsize[i]*(0.4+0.6*k);
  }
  pPosA.needsUpdate=pColA.needsUpdate=pSizeA.needsUpdate=true;
}
function clearParticles(){P.life.fill(0);P.size.fill(0);P.col.fill(0);}
function burst(p,c,n,speed,size,life,grav=0){
  for(let i=0;i<n;i++){ const u=Math.random()*2-1,a=Math.random()*6.2832,s=Math.sqrt(1-u*u),sp=speed*(0.25+Math.random()*0.75);
    emit(p.x,p.y,p.z,s*Math.cos(a)*sp,u*sp,s*Math.sin(a)*sp,c,size*(0.5+Math.random()),life*(0.6+Math.random()*0.6),grav); }
}
const ringGeo=new THREE.RingGeometry(0.62,0.7,56), rings=[];
function spawnRing(p,color,size=10,dur=0.6,k=1.6){
  const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:hdr(color,k),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.copy(p); m.lookAt(camera.position); scene.add(m); rings.push({m,t:0,dur,size});
}
function updateRings(dt){
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=dt; const k=r.t/r.dur;
    if(k>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);continue;}
    r.m.scale.setScalar(r.size*(0.2+Math.pow(k,0.55)*1.5)); r.m.material.opacity=0.85*(1-k); }
}

/* ---------- audio (calm, procedural) ---------- */
const BPM=98,STEP=60/BPM/4;
let AC=null,master,sfxBus,musicBus,noiseBuf,arpBus,arpFilter,engOsc,engGain,muted=false,nextT=0,stepN=0,lastBounceSfx=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain(); master.gain.value=muted?0:0.75;
  const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  sfxBus=AC.createGain(); sfxBus.gain.value=0.6; sfxBus.connect(master);
  musicBus=AC.createGain(); musicBus.gain.value=0.26; musicBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  arpFilter=AC.createBiquadFilter(); arpFilter.type='lowpass'; arpFilter.frequency.value=1400; arpFilter.Q.value=2;
  arpBus=AC.createGain(); arpBus.gain.value=0.6; arpBus.connect(arpFilter); arpFilter.connect(musicBus);
  const dl=AC.createDelay(1); dl.delayTime.value=STEP*3; const fb=AC.createGain(); fb.gain.value=0.3;
  arpFilter.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(musicBus);
  engOsc=AC.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=60;

  m.owner='player'; m.target=tgt; m.speed=Math.min(150,m.speed*1.9); m.turn=6; m.life=9; m.reflected=true;
  m.core.material=mMatP; m.halo.material=hP; if(m.mk){m.mk.remove(); m.mk=null;}
  if(tgt) m.dir.copy(tgt.pos).sub(m.pos).normalize(); else m.dir.negate();
  shellOK=true; shellT=0.55; player.parryCD=0.25; streak++; player.boost=Math.min(100,player.boost+15);
  burst(m.pos,hdr(0x7affc9,1.7),50,36,2,0.7); spawnRing(m.pos,0x7affc9,24,0.55);
  addShake(perfect?0.6:0.4); fovKick+=perfect?6:3;
  if(perfect){ slowT=0.2; addScore(300); popup('PERFECT BOUNCE','#ffffff'); sfx('perfect'); } else { addScore(150); popup('BOUNCE BACK','#7affc9'); sfx('parry'); }
  if(!tut.parry){ tut.parry=true; hint('Nice! Bounced missiles hunt the enemy that fired them — and blow up nearby planes too.',5); }
}
function hurt(n,at){
  player.hp-=n; streak=0; hurtV=1; player.invuln=0.9; shake=Math.max(shake,0.9); sfx('hurt'); burst(at||player.pos,hdr(RED,1.4),30,24,1.8,0.6);
  if(player.hp<=0){ player.hp=0; gameOver(); }
}

/* ---------- player flight ---------- */
function steerInput(){
  const S=0.4*Math.min(innerWidth,innerHeight);
  const dz=v=>Math.sign(v)*Math.max(0,Math.abs(v)-0.08)/0.92;
  let nx=mouse.in?dz((mouse.mx-innerWidth/2)/S):0, ny=mouse.in?dz(-(mouse.my-innerHeight/2)/S):0;
  if(keys.KeyA||keys.ArrowLeft) nx-=1; if(keys.KeyD||keys.ArrowRight) nx+=1; if(keys.KeyW||keys.ArrowUp) ny+=1; if(keys.KeyS||keys.ArrowDown) ny-=1;
  return {nx:clamp(nx,-1,1),ny:clamp(ny,-1,1)};
}
function updatePlayer(dt){
  const {nx,ny}=steerInput(), k=1-Math.exp(-5*dt);
  player.yawRate+=(-nx*1.5-player.yawRate)*k; player.pitchRate+=(ny*1.05-player.pitchRate)*k;
  player.yaw+=player.yawRate*dt; player.pitch=clamp(player.pitch+player.pitchRate*dt,-1.1,1.1);
  if(Math.abs(ny)<0.12) player.pitch-=player.pitch*0.6*dt;           // gentle auto-level
  if(player.autoTurn>0){ player.autoTurn-=dt; const ang=Math.atan2(player.pos.x,player.pos.z); /* heading toward centre */
    const want=Math.atan2(player.pos.x,player.pos.z); const diff=angDiff(player.yaw,want); player.yaw+=clamp(diff,-1.6*dt,1.6*dt); }
  player.roll+=(clamp(player.yawRate*0.6,-0.9,0.9)-player.roll)*Math.min(1,dt*6);
  // speed / boost
  const wantBoost=(keys.ShiftLeft||keys.ShiftRight)&&player.boost>0;
  if(wantBoost){ player.boost=Math.max(0,player.boost-30*dt); } else player.boost=Math.min(100,player.boost+8*dt);
  player.speed+=((wantBoost?88:46)-player.speed)*Math.min(1,dt*2.5);
  const f=getFwd();
  player.pos.addScaledVector(f,player.speed*dt); player.pos.addScaledVector(player.knock,dt); player.knock.multiplyScalar(Math.exp(-3*dt));
  player.invuln=Math.max(0,player.invuln-dt); player.bounceT=Math.max(0,player.bounceT-dt);
  player.parryCD=Math.max(0,player.parryCD-dt); player.fireCD-=dt;
  // --- soft "bounce back" collisions: forgiving, no crashing ---
  if(player.pos.y<FLOOR_Y){ player.pos.y=FLOOR_Y; player.pitch=Math.max(player.pitch,0.3); player.knock.y+=25; bounceFx(V3(0,1,0)); }
  if(player.pos.y>CEIL){ player.pos.y=CEIL; player.pitch=Math.min(player.pitch,-0.3); player.knock.y-=25; bounceFx(V3(0,-1,0)); }
  const d=Math.hypot(player.pos.x,player.pos.z);
  if(d>R_WORLD-8){ player.pos.x*=(R_WORLD-8)/d; player.pos.z*=(R_WORLD-8)/d; player.autoTurn=1.4; player.knock.x-=player.pos.x/d*40; player.knock.z-=player.pos.z/d*40; bounceFx(V3(-player.pos.x/d,0,-player.pos.z/d)); popup('BOUNDARY — BOUNCE!','#8defff'); }
  const t=towerAt(player.pos,3.5);
  if(t){ const dx=player.pos.x-t.x,dz=player.pos.z-t.z,px=t.hx+3.5-Math.abs(dx),pz=t.hz+3.5-Math.abs(dz); let n;
    if(px<pz){const s=dx>=0?1:-1;player.pos.x+=s*px;n=V3(s,0,0);}else{const s=dz>=0?1:-1;player.pos.z+=s*pz;n=V3(0,0,s);}
    const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw),dotv=fx*n.x+fz*n.z;
    if(dotv<0){ const rx=fx-2*dotv*n.x, rz=fz-2*dotv*n.z; player.yaw=Math.atan2(-rx,-rz); }
    player.knock.addScaledVector(n,45); bounceFx(n); }
  // engine trail
  const back=f.clone().multiplyScalar(-5);
  emit(player.pos.x+back.x,player.pos.y+back.y,player.pos.z+back.z,rand(-1,1),rand(-1,1),rand(-1,1),hdr(CYAN,wantBoost?1.7:1.0),wantBoost?2.4:1.6,0.5);
  if(wantBoost){ blurKick=0.05; fovKick=Math.max(fovKick,7); } 
}
function bounceFx(n){
  if(player.bounceT>0) return; player.bounceT=0.5;
  burst(player.pos,hdr(0x8defff,1.4),30,22,1.6,0.6); spawnRing(player.pos,0x8defff,20,0.5); sfx('bounce'); shake=Math.max(shake,0.5); player.invuln=Math.max(player.invuln,0.3); streak=streak;
}
function applyPlayerVisuals(rdt){
  plane.g.position.copy(player.pos); plane.g.rotation.set(player.pitch,player.yaw,player.roll,'YXZ');
  plane.eng.scale.setScalar(4+Math.sin(performance.now()*0.03)*0.4+(player.speed>60?1.8:0));
  plane.g.visible=!(player.invuln>0&&Math.floor(performance.now()/90)%2===0&&state==='playing');
  const f=getFwd(), want=player.pos.clone().addScaledVector(f,-16).add(V3(0,5.2,0));
  camera.position.lerp(want,1-Math.exp(-9*rdt));
  camera.lookAt(player.pos.clone().addScaledVector(f,42)); camera.rotateZ(player.roll*0.4);
  if(shake>0.001){ const s=shake*0.9; camera.position.x+=rand(-s,s)*0.3; camera.position.y+=rand(-s,s)*0.3; camera.position.z+=rand(-s,s)*0.3; camera.rotateZ(rand(-1,1)*shake*0.01); }
  camera.fov=72+fovKick+Math.max(0,(player.speed-46))*0.12; camera.updateProjectionMatrix(); camera.updateMatrixWorld(true); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
}

/* ---------- waves ---------- */
function startWave(){
  wave++; toSpawn=Math.min(wave,D.enemyMax); waveWait=2.5; announcedClear=false;
  popup('WAVE '+wave,'#ffffff',true); sfx('wave');
  if(wave>1) player.hp=Math.min(100,player.hp+25);
  for(let i=0;i<toSpawn;i++) setTimeout(()=>{ if(state==='playing') spawnEnemy(); },i*700);
}
function updateWaves(dt){
  if(wave>0&&toSpawn>=0&&enemies.length===0&&performance.now()-waveStartT>1500){
    if(!announcedClear){ announcedClear=true; popup('WAVE CLEARED +'+wave*500,'#7affc9'); score+=wave*500; }
    waveWait-=dt; if(waveWait<=0){ startWave(); waveStartT=performance.now(); }
  } else if(wave===0){ waveWait-=dt; if(waveWait<=0){ startWave(); waveStartT=performance.now(); } }
}
let waveStartT=0;

/* ---------- main update ---------- */
function update(dt,rdt){
  updatePlayer(dt);
  if(mouseDown||keys.KeyF||keys.KeyQ){ if(player.fireCD<=0){ fire(); player.fireCD=0.14; } }
  if(player.parryT>0){ player.parryT-=dt;
    for(let i=0;i<missiles.length;i++){ const m=missiles[i]; if(m.owner!=='enemy') continue; const d=m.pos.distanceTo(player.pos); if(d<62) reflectMissile(m,d<24); } }
  updateBullets(dt); updateMissiles(dt); updateEnemies(dt); updateGates(dt); updateWaves(dt);
  // threat warning
  let near=1e9; for(const m of missiles){ if(m.owner==='enemy'){ near=Math.min(near,m.pos.distanceTo(player.pos)); } }
  $('prompt').classList.toggle('on',near<95&&player.parryCD<=0);
  if(near<170){ beepT-=dt; if(beepT<=0){ sfx('beep'); beepT=clamp(near/260,0.1,0.6); } }
  // tutorial nudges
  tutT+=rdt;
  if(tutT>8&&!tut.fire&&enemies.length>0){ hint('Hold LEFT CLICK (or F) to shoot — follow the pink ◆ marker to find enemies. Shots auto-aim a little.',7); tut.fire=true; }
}
function updateVisuals(rdt,now){
  updateParticles(rdt*Math.max(timeScale,0.3)); updateRings(rdt);
  U.uCam.value.copy(camera.position); U.uPlayer.value.copy(player.pos);
  ground.position.set(camera.position.x,0,camera.position.z); sky.position.copy(camera.position);
  shake*=Math.exp(-7*rdt); fovKick*=Math.exp(-6*rdt); hurtV=Math.max(0,hurtV-rdt*1.4); blurKick*=Math.exp(-6*rdt);
  fxPass.uniforms.uHurt.value=hurtV*0.7; fxPass.uniforms.uBlur.value=blurKick;
  if(shellT>0){ shellT-=rdt; const k=clamp(shellT/0.55,0,1); shell.position.copy(player.pos); shell.scale.setScalar(6+(1-k)*58);
    shell.material.opacity=0.3*k; shell.material.color.copy(shellOK?hdr(0x7affc9,1.4):hdr(0x6677aa,0.9)); shell.visible=true; } else shell.visible=false;
  if(hintT>0){ hintT-=rdt; if(hintT<=0) $('hint').style.opacity=0; }
  if(AC&&engGain){ engGain.gain.setTargetAtTime(state==='playing'&&!muted?0.045:0,AC.currentTime,0.1); engOsc.frequency.setTargetAtTime(52+player.speed*0.9,AC.currentTime,0.1); }
  for(const g of gates) g.m.material.color.copy(hdr(GOLD,1.2+0.4*Math.sin(now*0.004)));
  // markers
  if(state==='playing'||state==='paused'||state==='over'){
    for(const e of enemies) placeMarker(e.mk,e.pos,Math.round(e.pos.distanceTo(player.pos))+'m','◆','▲');
    for(const m of missiles) if(m.mk){ const d=m.pos.distanceTo(player.pos); m.mk.classList.toggle('danger',d<95); placeMarker(m.mk,m.pos,Math.round(d)+'m','▼','▲'); }
    for(const g of gates) placeMarker(g.mk,g.pos,Math.round(g.pos.distanceTo(player.pos))+'m','○','▲');
  }
}

/* ---------- HUD ---------- */
const H_={score:$('scoreV'),wave:$('waveV'),en:$('enemiesV'),streak:$('streakV'),hull:$('hullBar'),hullBox:$('hull'),bb:$('bbBar'),boost:$('boostBar'),spd:$('spd')};
function updateHUD(rdt){
  dispScore+=(score-dispScore)*Math.min(1,rdt*10); H_.score.textContent=String(Math.round(dispScore)).padStart(7,'0');
  H_.wave.textContent=Math.max(1,wave); H_.en.textContent=enemies.length?('ENEMIES '+enemies.length):'';
  H_.streak.textContent='x'+mult(); H_.hull.style.width=player.hp+'%'; H_.hullBox.classList.toggle('low',player.hp<=30);
  H_.bb.style.width=(100*(1-player.parryCD/D.parryCD))+'%'; H_.boost.style.width=player.boost+'%'; H_.spd.textContent=Math.round(player.speed*3.2)+' KM/H';
}

/* ---------- overlay / flow ---------- */
const ov=$('overlay'),ovBody=$('ovBody'),hud=$('hud'),aim=$('aim'),cross=$('cross');
const TEMPLATES={
  menu:()=>`<h1>NEON<br>RICOCHET SKIES</h1><h2>FLY · BOUNCE BACK · SURVIVE</h2>
    <div class="keys"><span><kbd>MOUSE</kbd></span><span>Steer — the plane follows your cursor (or use <kbd>W A S D</kbd>)</span>
    <span><kbd>LEFT CLICK</kbd></span><span>Shoot (auto-aims a little)</span>
    <span><kbd>SPACE</kbd> / <kbd>RIGHT CLICK</kbd></span><span><b style="color:#7affc9">BOUNCE BACK</b> — send enemy missiles home</span>
    <span><kbd>SHIFT</kbd></span><span>Boost</span><span><kbd>G</kbd> <kbd>M</kbd> <kbd>P</kbd></span><span>Glow level · Mute · Pause</span></div>
    <div class="diff"><div class="btn ${diffKey==='easy'?'sel':''}" data-diff="easy">EASY</div><div class="btn ${diffKey==='normal'?'sel':''}" data-diff="normal">NORMAL</div></div>
    <div class="btn go" data-start="1">START FLYING</div>
    <div class="tip">Walls, the ground and towers never crash you — they just bounce you back. Collect gold rings for boost. When a red missile gets close, hit Bounce Back.</div>`,
  pause:()=>`<h1 style="font-size:clamp(28px,5vw,60px)">PAUSED</h1><div class="btn go" data-start="1">RESUME</div><div class="tip">Press P or Esc to pause / resume</div>`,
  over:()=>`<h1 style="font-size:clamp(28px,5.5vw,70px)">HULL BREACH</h1>
    <div class="keys" style="font-size:16px"><span>SCORE</span><b>${Math.round(score)}</b><span>WAVE</span><b>${wave}</b><span>BEST</span><b>${Math.round(best)}</b></div>
    <div class="btn go" data-start="1">FLY AGAIN</div>`
};
function showOverlay(mode){ ov.dataset.mode=mode; ovBody.innerHTML=TEMPLATES[mode](); ov.style.display='flex'; hud.style.display=mode==='menu'?'none':'block';
  document.body.classList.remove('playing'); aim.style.display='none'; cross.style.display='none'; }
function hideOverlay(){ ov.style.display='none'; hud.style.display='block'; document.body.classList.add('playing'); aim.style.display='block'; cross.style.display='block'; }
function resetGame(){
  for(const m of missiles){scene.remove(m.g); if(m.mk)m.mk.remove();} missiles.length=0;
  for(const e of enemies){scene.remove(e.g); e.mk.remove();} enemies.length=0;
  for(const b of bullets) scene.remove(b.m); bullets.length=0;
  for(const r of rings){scene.remove(r.m);r.m.material.dispose();} rings.length=0;
  for(const g of gates){scene.remove(g.m); g.mk.remove();} gates.length=0;
  clearParticles(); $('feed').innerHTML='';
  Object.assign(player,{yaw:0,pitch:0,roll:0,yawRate:0,pitchRate:0,speed:46,hp:100,boost:100,invuln:0,parryT:0,parryCD:0,fireCD:0,bounceT:0,autoTurn:0});
  player.pos.set(0,90,350); player.knock.set(0,0,0);
  camera.position.set(0,95,366);
  score=0;dispScore=0;streak=0;wave=0;toSpawn=0;waveWait=2.0;announcedClear=true;globalCD=2;shake=fovKick=hurtV=blurKick=slowT=0;timeScale=1;tutT=0;
  tut.fire=false;tut.missile=false;tut.parry=false; waveStartT=performance.now();
  for(let i=0;i<4;i++) spawnGate();
}
function startGame(){
  initAudio(); D=DIFF[diffKey]; resetGame(); state='playing'; hideOverlay();
  if(musicBus&&AC) musicBus.gain.setTargetAtTime(0.26,AC.currentTime,0.2);
  hint('Move your mouse to steer — the plane follows your cursor. Fly toward the pink ◆ enemy marker. Gold ○ rings give boost.',7);
}
function gameOver(){
  state='over'; if(score>best){best=score; try{localStorage.setItem('nrs_best',String(Math.round(best)));}catch(e){}}
  sfx('over'); if(musicBus&&AC) musicBus.gain.setTargetAtTime(0.08,AC.currentTime,0.4);
  burst(player.pos,hdr(RED,1.6),90,40,2.4,1); mouseDown=false; $('prompt').classList.remove('on');
  setTimeout(()=>{ if(state==='over') showOverlay('over'); },900);
}
function pauseGame(){ if(state!=='playing') return; state='paused'; mouseDown=false; showOverlay('pause'); }
function resumeGame(){ if(state!=='paused') return; state='playing'; hideOverlay(); }
ov.addEventListener('click',e=>{
  initAudio(); const dEl=e.target.closest('[data-diff]');
  if(dEl){ diffKey=dEl.dataset.diff; showOverlay('menu'); return; }
  if(e.target.closest('[data-start]')){ if(ov.dataset.mode==='pause') resumeGame(); else startGame(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
addEventListener('blur',pauseGame);

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys[e.code]=true;
  if(e.code==='Space') tryParry();
  if(e.code==='KeyM'){ muted=!muted; if(master) master.gain.value=muted?0:0.75; }
  if(e.code==='KeyG'){ glowIdx=(glowIdx+1)%GLOW.length; bloom.enabled=GLOW[glowIdx]>0; bloom.strength=GLOW[glowIdx]; if(state==='playing') popup('GLOW: '+GLOW_NAME[glowIdx],'#cfe8ff'); }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='playing') pauseGame(); else if(state==='paused') resumeGame(); }
  if(e.code==='Enter'){ if(state==='menu'||state==='over') startGame(); else if(state==='paused') resumeGame(); }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('mousedown',e=>{ if(state!=='playing') return; if(e.button===0) mouseDown=true; if(e.button===2) tryParry(); });
addEventListener('mouseup',e=>{ if(e.button===0) mouseDown=false; });
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{ mouse.mx=e.clientX; mouse.my=e.clientY; mouse.in=true; aim.style.transform=`translate(${e.clientX}px,${e.clientY}px)`; });
document.addEventListener('mouseleave',()=>{ mouse.in=false; });
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  pmat.uniforms.uScale.value=innerHeight*PR/(2*Math.tan(THREE.MathUtils.degToRad(72)/2)); }
addEventListener('resize',onResize); onResize();

/* ---------- attract mode ---------- */
let attractA=0;
function attract(rdt){
  attractA+=rdt*0.35;
  plane.g.visible=true; plane.g.position.set(0,90,0); plane.g.rotation.set(0.1,attractA*0.6,Math.sin(attractA)*0.35,'YXZ');
  camera.position.set(Math.cos(attractA)*26,96+Math.sin(attractA*0.8)*4,Math.sin(attractA)*26); camera.lookAt(0,90,0);
  camera.fov=60; camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
  emit(plane.g.position.x+rand(-1,1),90+rand(-1,1),rand(-1,1)+Math.sin(attractA*0.6)*5,rand(-2,2),rand(-2,2),rand(-2,2),hdr(CYAN,1),1.6,0.8);
  U.uPlayer.value.set(0,90,0);
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='playing'){
    if(slowT>0){slowT-=rdt;timeScale=0.35;} else timeScale+=(1-timeScale)*Math.min(1,rdt*8);
    const dt=rdt*timeScale; update(dt,rdt); applyPlayerVisuals(rdt); updateHUD(rdt);
  } else if(state==='over'){
    const dt=rdt*0.5; updateMissiles(dt); updateEnemies(dt); applyPlayerVisuals(rdt); updateHUD(rdt);
  } else if(state==='paused'){
    applyPlayerVisuals(0);
  } else attract(rdt);
  if(state!=='paused') updateVisuals(rdt,now);
  composer.render();
}
bloom.enabled=GLOW[glowIdx]>0;
requestAnimationFrame(frame);
showOverlay('menu');
</script>
